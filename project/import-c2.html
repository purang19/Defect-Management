const SUPA = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const logEl = document.getElementById('log');
function log(msg, cls){ logEl.style.display='block'; const s=document.createElement('div'); if(cls)s.className=cls; s.textContent=msg; logEl.appendChild(s); logEl.scrollTop=logEl.scrollHeight; }
let session = null;

async function refreshAuth(){
  const { data } = await SUPA.auth.getSession();
  session = data.session || null;
  const box = document.getElementById('authBox');
  if (session){
    box.innerHTML = '<div class="muted" style="font-size:13px">เข้าสู่ระบบแล้ว / Signed in as <b>'+(session.user?session.user.email:'')+'</b></div>';
  } else {
    box.innerHTML = '<label>อีเมล / Email</label><input id="em" type="email" autocomplete="username">'
      +'<label>รหัสผ่าน / Password</label><input id="pw" type="password" autocomplete="current-password">'
      +'<div class="row"><button class="primary" id="btnLogin">เข้าสู่ระบบ / Sign in</button></div>';
    document.getElementById('btnLogin').onclick = async ()=>{
      const email=document.getElementById('em').value.trim(), password=document.getElementById('pw').value;
      const { error } = await SUPA.auth.signInWithPassword({email,password});
      if (error){ log('Sign in failed: '+error.message,'err'); return; }
      await refreshAuth(); log('Signed in.','ok');
    };
  }
}
SUPA.auth.onAuthStateChange((_e,s)=>{ session=s; });

async function defectCount(){
  const { count, error } = await SUPA.from('defects').select('id',{count:'exact',head:true});
  if (error) throw error; return count||0;
}
async function loadConfig(){
  const { data, error } = await SUPA.from('app_config').select('hotels').eq('id',1).maybeSingle();
  if (error) throw error; return data;
}

document.getElementById('btnCheck').onclick = async ()=>{
  try {
    const cfg = await loadConfig();
    const sands = (cfg&&cfg.hotels||[]).find(h=>h.id==='sands');
    const hasC2 = !!(sands && sands.buildings.find(b=>b.name==='C2'||b.id==='sandsC2'));
    log('Current defects rows: '+ await defectCount());
    log('app_config C2 building present: '+ hasC2);
  } catch(e){ log('Check failed: '+(e.message||e),'err'); }
};

document.getElementById('btnRun').onclick = async ()=>{
  if (!session){ log('Please sign in first.','err'); return; }
  if (!confirm('เพิ่มตึก C2 และ '+C2_DEFECTS.length+' defect ลงฐานข้อมูล? (ไม่ลบของเดิม)\nAdd C2 building + '+C2_DEFECTS.length+' defects? Existing data is kept.')) return;
  try{
    // 1) Config: add C2 building if missing (surgical, preserves everything else)
    log('Reading app_config…');
    const cfg = await loadConfig();
    if (!cfg || !Array.isArray(cfg.hotels)) throw new Error('app_config.hotels not found');
    const hotels = JSON.parse(JSON.stringify(cfg.hotels));
    const sands = hotels.find(h=>h.id==='sands');
    if (!sands) throw new Error('hotel "sands" not found in app_config');
    let c2 = sands.buildings.find(b=>b.name==='C2'||b.id==='sandsC2');
    if (c2){
      log('C2 building already present ("'+c2.name+'") — leaving config as is.','ok');
    } else {
      sands.buildings.push(C2_BUILDING);
      const { error } = await SUPA.from('app_config').update({ hotels }).eq('id',1);
      if (error) throw error;
      c2 = C2_BUILDING;
      log('C2 building added to app_config ('+C2_BUILDING.floors.length+' floors, '
          +C2_BUILDING.floors.reduce((s,f)=>s+f.rooms.length,0)+' rooms).','ok');
    }
    const buildingId = c2.id;
    // 2) Defects: append (insert-only; existing rows untouched, re-run safe)
    const before = await defectCount();
    log('Defects before: '+before+'. Inserting C2 defects (append)…');
    const rows = C2_DEFECTS.map(r=>({ id:r.id, data:{...r, buildingId}, created_at:r.createdAt }));
    const CH=100; let done=0;
    for (let i=0;i<rows.length;i+=CH){
      const chunk = rows.slice(i,i+CH);
      const { error } = await SUPA.from('defects').upsert(chunk,{ onConflict:'id', ignoreDuplicates:true });
      if (error) throw error;
      done += chunk.length; log('Processed '+done+'/'+rows.length+'…');
    }
    const after = await defectCount();
    log('DONE. Defects: '+before+' → '+after+' (+'+(after-before)+').','ok');
    log('Open the app and hard-refresh; select building C2.','ok');
  } catch(e){ log('Import failed: '+(e.message||e),'err'); }
};
refreshAuth();
</script>
